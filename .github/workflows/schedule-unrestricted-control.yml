name: Unrestricted Scheduler Control

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduler control
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = schedule
          printf 'scheduler_control=true actor=%s triggering_actor=%s sha=%s\n' \
            "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
